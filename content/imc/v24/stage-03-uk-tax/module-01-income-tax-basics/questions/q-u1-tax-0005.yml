stem: Which statement about returns earned inside a stocks and shares ISA is correct?
options:
- id: a
  text: Gains are free of capital gains tax, but dividends are taxed as normal
- id: b
  text: Income and gains are free of UK income tax and capital gains tax
- id: c
  text: Returns are tax-free only if held for five years
- id: d
  text: Returns are taxed when withdrawn, like a pension
correct: b
explanation: ISA investments grow free of UK income tax and capital gains tax, and withdrawals are not taxed.
distractor_notes:
  a: Dividends inside an ISA are also free of income tax.
  c: There is no minimum holding period for the tax benefits.
  d: Unlike pension withdrawals, ISA withdrawals are not taxed.
