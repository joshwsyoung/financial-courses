- id: tax-drill-basic
  type: calc_drill
  title: 'Drill: basic-rate income tax'
  minutes: 3
  lo:
  - 6.2.4
  drill:
    prompt: Salary of £{salary}, no other income, full personal allowance, 2026-27 rUK rates. Income tax due (£)?
    inputs:
      salary:
        min: 15000
        max: 50000
        step: 500
    formula: (salary - 12570) * 0.2
    tolerance: 1
    units: £
    rounds: 5
