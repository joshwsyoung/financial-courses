- id: code-fc-components
  type: flashcard
  title: 'Flashcard: the six components of the Code'
  minutes: 1
  lo:
  - 2.2.1
  front: In short form, what are the six components of the CFA Code of Ethics?
  back: "1. Integrity, competence, diligence and respect. 2. Profession and clients before self. 3. Reasonable care
    and independent judgement. 4. Act professionally and encourage others to. 5. Support fair, trusted capital markets.
    6. Keep your competence up to date, and help others do the same."
- id: code-standards-diagram
  type: diagram
