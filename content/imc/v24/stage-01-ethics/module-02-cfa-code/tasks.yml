  minutes: 2
  lo:
  - 2.2.1
  file: standards-diagram.md
- id: code-memory-standards
  type: memory_aid
  title: Remember the seven Standards
  minutes: 2
  lo:
  - 2.2.1
  memory:
    intro: The seven Standards always come in the same order. Each word of this sentence starts with the same letter
      as one Standard.
    device:
      kind: phrase
      text: 'Please Invest Diligently: Don''t Ignore Client Rights'
      letters: PIDDICR
    ordered: true
    items:
    - label: Professionalism
      detail: 'Standard I: law, independence and objectivity, misrepresentation, misconduct, competence'
    - label: Integrity of capital markets
      detail: 'Standard II: no use of material non-public information, no market manipulation'
    - label: Duties to clients
      detail: 'Standard III: loyalty, fair dealing, suitability, performance figures, confidentiality'
    - label: Duties to employers
      detail: 'Standard IV: loyalty to the employer, consent for outside pay, supervision'
    - label: Investment analysis and actions
      detail: 'Standard V: Investment Analysis, Recommendations, and Actions. Reasonable basis, clear communication,
        record keeping'
    - label: Conflicts of interest
      detail: 'Standard VI: disclose conflicts, put client trades first, disclose referral fees'
    - label: Responsibilities as member or candidate
      detail: 'Standard VII: exam and programme integrity, accurate use of the CFA designation'
