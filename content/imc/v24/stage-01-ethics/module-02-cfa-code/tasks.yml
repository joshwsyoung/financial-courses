- id: code-fc-stricter
  type: flashcard
  title: 'Flashcard: when the law and the Standards differ'
  minutes: 1
  lo:
  - 2.2.1
  - 2.2.3
  front: The law and the CFA Standards set different requirements. Which do you follow?
  back: Whichever is stricter. If you learn that others are breaking the law or the Standards, do not take part, and
    step away from the activity.
