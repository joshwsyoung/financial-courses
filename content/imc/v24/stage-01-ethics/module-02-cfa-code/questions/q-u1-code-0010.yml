stem: A pension fund client offers an investment manager a personal annual fee to give its trustees evening training
  on asset allocation. The work could compete with services her employer sells. What must she do before accepting?
options:
- id: a
  text: Nothing, because the work is done outside office hours
- id: b
  text: Get written consent from her employer, having told it the terms
- id: c
  text: Tell the client's trustees that she is an employee
- id: d
  text: Pass the fee to charity, so that there is no conflict
correct: b
explanation: Standard IV(B) covers additional compensation arrangements. Before accepting pay that could compete with
  her employer or create a conflict, she must get written consent from her employer.
distractor_notes:
  a: Working outside office hours does not remove the potential conflict with her employer.
  c: The trustees probably know this already. The consent needed is her employer's.
  d: Giving the money away does not remove the competing work or the need for consent.
