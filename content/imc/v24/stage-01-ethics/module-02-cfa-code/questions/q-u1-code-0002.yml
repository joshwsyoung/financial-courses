stem: Under which of the seven Standards would you find the duty not to trade on material non-public information?
options:
- id: a
  text: Duties to clients
- id: b
  text: Integrity of capital markets
- id: c
  text: Conflicts of interest
- id: d
  text: Professionalism
correct: b
explanation: Standard II, Integrity of capital markets, covers material non-public information and market manipulation.
  Both are about keeping markets fair for everyone, not just your own clients.
distractor_notes:
  a: Insider dealing harms the whole market, so it sits under market integrity, not client duties.
  c: Using inside information can create a conflict, but the specific duty sits under Standard II.
  d: Professionalism covers law, independence, misrepresentation and misconduct, not inside information specifically.
