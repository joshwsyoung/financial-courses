stem: A company offers an analyst who covers it a free weekend at a luxury hotel, shortly before she updates her rating.
  Which value underneath the Code and Standards is most directly at stake?
options:
- id: a
  text: Independence and objectivity
- id: b
  text: Confidentiality
- id: c
  text: Competence
- id: d
  text: Fair dealing between clients
correct: a
explanation: A lavish gift from a company you cover could sway your judgement, or look as if it does. Protecting
  independence and objectivity is the value most directly at stake.
distractor_notes:
  b: No client information is being disclosed.
  c: The gift does not affect her knowledge or skill, only potentially her judgement.
  d: Fair dealing is about treating clients fairly against each other, not gifts from companies.
