stem: Why does ethical behaviour matter more in financial services than in many other industries?
options:
- id: a
  text: Financial products are always more profitable than other products
- id: b
  text: Clients often know less than the professional and cannot easily check the quality of advice
- id: c
  text: Ethics is a legal requirement only in financial services
- id: d
  text: Financial firms have no regulators, so ethics replaces regulation
correct: b
explanation: Information asymmetry is the key reason. Clients depend on the professional's honesty because they
  cannot easily judge advice, and problems can take years to show up.
distractor_notes:
  a: Profitability is not what makes ethics especially important.
  c: Ethics matters in every industry; finance is not unique in having legal duties.
  d: Financial services are heavily regulated, by the FCA and PRA among others.
