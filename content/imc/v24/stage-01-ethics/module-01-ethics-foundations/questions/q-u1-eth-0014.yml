stem: A firm makes it easy to buy an investment product online but requires a posted letter and a phone call
  to close it. Which Consumer Duty outcome is most at risk?
options:
  - id: a
    text: Price and value
  - id: b
    text: Consumer support
  - id: c
    text: Products and services
  - id: d
    text: Consumer understanding
correct: b
explanation: Consumer support expects leaving or switching to be no harder than buying. Making exit much
  harder than entry is a classic support failure.
distractor_notes:
  a: Price and value concerns whether the price is reasonable compared with the benefits.
  c: Products and services concerns design for a target market.
  d: Consumer understanding concerns how clearly the firm communicates.
