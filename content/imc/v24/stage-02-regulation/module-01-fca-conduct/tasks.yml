- id: eth-memory-conduct-rules
  type: memory_aid
  title: Remember the six Conduct Rules
  minutes: 2
  lo:
  - 3.3.9
  memory:
    intro: Six rules is a lot to hold in your head. Hang each one on a word in this sentence.
    device:
      kind: phrase
      text: I Don't Overlook Customers, Markets or Outcomes
      letters: IDOCMO
    ordered: true
    items:
    - label: Integrity
      detail: 'Rule 1: act with integrity'
    - label: Due skill, care and diligence
      detail: 'Rule 2: act with due skill, care and diligence'
    - label: Open and cooperative with regulators
      detail: 'Rule 3: be open and cooperative with the FCA, the PRA and other regulators'
    - label: Customers' interests, treated fairly
      detail: 'Rule 4: pay due regard to the interests of customers and treat them fairly'
    - label: Market conduct standards
      detail: 'Rule 5: observe proper standards of market conduct'
    - label: Outcomes for retail customers
      detail: 'Rule 6: act to deliver good outcomes for retail customers'
- id: eth-fc-rule-1
  type: flashcard
  title: 'Flashcard: the first Conduct Rule'
  minutes: 1
  lo:
  - 3.3.9
  front: What does individual Conduct Rule 1 require?
  back: You must act with integrity.
